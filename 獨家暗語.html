<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>獨家暗語｜四人合作猜詞</title>
<style>
:root{--blue:#354fc1;--ink:#26334c;--cream:#f6f8ff;--ok:#158463;--red:#bf3e54;--gold:#eab858;--border:#dce2f4}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(130deg,#eaf1ff,#fff9ed);font-family:system-ui,-apple-system,'Noto Sans TC','Microsoft JhengHei',sans-serif;font-size:20px;min-height:100vh}header{background:white;border-bottom:1px solid var(--border);padding:16px max(16px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:26px}.badge{font-size:15px;color:#52607b}button,input,select{font:inherit}button{border:0;background:var(--blue);color:white;padding:15px 22px;border-radius:16px;font-weight:750;cursor:pointer;min-height:52px}button:disabled{opacity:.44;cursor:default}button.secondary{background:white;color:var(--blue);border:2px solid var(--border)}button.warning{background:var(--red)}button.success{background:var(--ok)}button:focus-visible,input:focus-visible{outline:4px solid #f7bc3b;outline-offset:2px}.tiny{padding:9px 13px;min-height:39px;font-size:16px}main{width:min(100%,1080px);margin:25px auto;padding:0 16px 80px}.panel{background:#fff;border:2px solid var(--border);box-shadow:0 8px 28px #1c346710;border-radius:24px;padding:26px;margin-bottom:20px}.center{text-align:center}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.between{justify-content:space-between}.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.score{border-radius:14px;padding:12px 8px;text-align:center;background:#edf2ff;border:2px solid transparent;font-size:16px}.score.active{border-color:var(--blue);background:#e5eaff}.score b{display:block;font-size:28px}.score .name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:#62718a}.phase{font-size:16px;color:#445ec5;font-weight:750;letter-spacing:1px}h1{font-size:clamp(30px,5vw,45px);margin:15px 0}h2{font-size:27px;margin:5px 0 20px}p{line-height:1.6}.word{display:inline-block;background:#f0f3ff;color:#293caa;padding:18px 32px;border-radius:20px;font-size:clamp(36px,7vw,62px);font-weight:900;letter-spacing:5px}.hint{border:2px solid #cfdaf8;background:#f4f7ff;border-radius:18px;padding:22px;font-size:30px;font-weight:800;text-align:center;word-break:break-all}.hint.cross{background:#f4e9ec;color:#a94a5b;text-decoration:line-through;border-color:#eac3ce}.answer-choice{width:100%;font-size:25px;background:white;color:var(--ink);border:3px solid #cad3e9;min-height:88px}.answer-choice:not(:disabled):hover{border-color:var(--blue);background:#eff3ff}.answer-choice.correct{border-color:var(--ok);background:#dbf6e9;color:#126147}.answer-choice.wrong{border-color:var(--red);background:#ffeaed;color:#9b2e45}input{padding:16px;border:2px solid #bdc8e6;border-radius:14px;width:100%;max-width:540px;background:white}input[type=checkbox]{width:auto;transform:scale(1.3);margin-right:9px}.spaced{margin-top:22px}.pill{background:#edf2ff;color:#344db3;padding:8px 13px;border-radius:50px;font-size:17px}.rules{font-size:17px;line-height:1.6;background:#f8faff;padding:16px;border-radius:15px}.result-good{color:var(--ok);font-weight:900}.result-bad{color:var(--red);font-weight:900}.separator{height:1px;background:var(--border);margin:20px 0}.cover{background:#24315d;color:white;border-radius:20px;padding:46px 15px}.cover p{color:#e0e9ff}.cover button{background:#fff;color:#2739a9}.toast{color:#b93145;font-size:16px;min-height:25px}.footer{font-size:14px;color:#62718a;margin-top:25px}details{padding:14px;background:#f6f8fc;border-radius:14px;margin-top:16px}summary{cursor:pointer;font-weight:700}label{font-weight:700}select{padding:10px;border:2px solid #ccd6ee;border-radius:10px;background:white;max-width:100%}@media(max-width:580px){body{font-size:18px}.panel{padding:17px}.scores{grid-template-columns:repeat(2,1fr)}button{width:100%}header button{width:auto}h2{font-size:23px}}
</style>
</head>
<body>
<header><div><strong>🎯 獨家暗語</strong><div class="badge">四人合作猜詞｜資源班互動版</div></div><button class="secondary tiny" id="homeBtn">⚙ 設定／記分</button></header>
<main><div id="scoreboard"></div><div id="screen"></div></main>
<script>
'use strict';
const BANK=[
['西瓜','蘋果','籃球','雨傘'],['香蕉','玉米','月亮','牙刷'],['冰箱','電風扇','洗衣機','電視'],['鉛筆','橡皮擦','尺','書包'],['老虎','獅子','貓咪','熊貓'],['公車','火車','飛機','腳踏車'],['蛋糕','餅乾','麵包','布丁'],['醫院','學校','超市','圖書館'],['帽子','手套','外套','襪子'],['太陽','星星','彩虹','烏雲'],['手機','平板','電腦','相機'],['披薩','漢堡','水餃','壽司'],['游泳','跑步','跳繩','騎車'],['牙醫','警察','老師','廚師'],['鯊魚','海豚','螃蟹','章魚'],['聖誕節','生日','端午節','中秋節'],['便當','泡麵','飯糰','三明治'],['紅綠燈','斑馬線','人行道','停車場'],['剪刀','膠水','釘書機','膠帶'],['蝴蝶','蜜蜂','螞蟻','蜻蜓'],['地震','颱風','下雨','打雷'],['書店','郵局','銀行','便利商店'],['害怕','開心','生氣','難過'],['合作','分享','排隊','禮貌'],['迷路','遲到','忘記','等待'],['安靜','吵鬧','整齊','乾淨'],['節約','回收','浪費','污染'],['勇敢','耐心','誠實','細心'],['公園','操場','教室','餐廳'],['刷牙','洗手','洗澡','洗臉'],['餅乾','糖果','巧克力','冰淇淋'],['狗','兔子','烏龜','鸚鵡'],['門','窗戶','椅子','桌子'],['雨衣','雨鞋','雨傘','水壺'],['牛奶','豆漿','果汁','白開水'],['火山','山谷','海洋','沙漠'],['地圖','指南針','望遠鏡','放大鏡'],['足球','排球','羽毛球','棒球'],['鬧鐘','時鐘','手錶','日曆'],['操場','溜滑梯','盪鞦韆','沙坑']
];
const KEY='justone-classroom-v1';
const fresh=()=>({names:['學生 1','學生 2','學生 3','學生 4'],points:[0,0,0,0],round:0,stage:'setup',guessIndex:0,writer:0,clues:['','','',''],entered:[false,false,false,false],coverTarget:0,mcSelection:null,outcome:null,logs:[],order:[],teacherPick:'',custom:[],message:''});
let s;try{s={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'null')}}catch(_){s=fresh()}if(!Array.isArray(s.order))s.order=[];
const $=id=>document.getElementById(id), save=()=>localStorage.setItem(KEY,JSON.stringify(s));
const esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
const btn=(label,action,cls='')=>`<button class="${cls}" data-act="${action}">${label}</button>`;
const other=()=>[0,1,2,3].filter(i=>i!==s.guessIndex);
const target=()=>{let all=[...BANK,...s.custom];return all[s.order[s.round% s.order.length]]||BANK[0]};
const clean=x=>String(x).normalize('NFKC').trim().replace(/\s+/g,'').toLowerCase();
function duplicates(){const a=other();return a.filter(i=>a.some(j=>j!==i&&clean(s.clues[i])&&clean(s.clues[i])===clean(s.clues[j])))}
const activeClues=()=>other().filter(i=>!duplicates().includes(i));
function shuffled(n){let a=Array.from({length:n},(_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setupOrder(){s.order=shuffled(BANK.length+s.custom.length);s.round=0;}
function nextWriter(){return other().find(i=>!s.entered[i]);}
function scoreboard(){return `<div class="panel"><div class="row between"><b>🏆 個人得分</b><span class="pill">第 ${s.round+1} 回合</span></div><div class="scores spaced">${s.names.map((name,i)=>`<div class="score ${s.stage!=='setup'&&i===s.guessIndex?'active':''}"><span class="name">${esc(name)}${s.stage!=='setup'&&i===s.guessIndex?' 🎯':''}</span><b>${s.points[i]}</b> 分</div>`).join('')}</div></div>`}
function screen(){let t=target(),body='';
if(s.stage==='setup')body=`<div class="phase">開始前設定</div><h1>四人一起玩！</h1><p>輸入 4 位學生的稱呼，系統會自動輪流選出猜題者。</p><div class="grid">${s.names.map((n,i)=>`<div><label for="name${i}">學生 ${i+1}</label><input id="name${i}" maxlength="15" value="${esc(n)}"></div>`).join('')}</div><div class="spaced">${btn('▶ 開始遊戲','start','success')}</div><div class="rules spaced"><b>計分規則</b><br>直接猜對：猜題者 +2 分。<br>有效且未重複的提示：提供提示者各 +1 分（本回合成功猜對時）。<br>改選擇題並答對：猜題者 +1 分；有效提示者仍各 +1 分。<br>選錯或按「我猜不到」：猜題者 0 分，提示者也不加分。<br>相同提示全部遮蓋、提供者不得分。每個答案只能猜一次。<br><b>違規：</b>有人不小心說出答案，整題作廢、全員 +0 分，下一題仍由同一位學生猜。</div><details><summary>老師設定：新增自訂詞彙（選填）</summary><p class="muted">每行填 4 個不同詞彙，以逗號分開，第一個是正確答案，其他 3 個是選擇題干擾選項。</p><textarea id="customInput" style="width:100%;min-height:120px;font:inherit;padding:12px;border:2px solid #ccd6ee;border-radius:12px" placeholder="圓周率,圓心,半徑,直徑"></textarea>${btn('加入題庫','addCustom','secondary tiny')}<p class="muted" id="customCount">目前自訂題目：${s.custom.length} 題</p></details>`;
else if(s.stage==='intro')body=`<div class="phase">第 ${s.round+1} 回合｜輪流猜題</div><h1>這一回合的猜題者</h1><div class="center"><span class="word">${esc(s.names[s.guessIndex])}</span><p>請猜題者先轉身或離開螢幕。<br>其餘三位同學輪流秘密輸入提示詞。</p>${btn('猜題者已轉身，開始寫提示','beginWriting')}</div>`;
else if(s.stage==='handoff')body=`<div class="phase">秘密輸入提示</div><div class="cover center"><h1>🔒 換下一位同學</h1><p>請把裝置交給 <b>${esc(s.names[s.coverTarget])}</b><br>猜題者 <b>${esc(s.names[s.guessIndex])}</b> 不能看螢幕。</p>${btn('我是 '+esc(s.names[s.coverTarget])+'，顯示題目','openWord')}</div>`;
else if(s.stage==='writing')body=`<div class="phase">提示詞 ${s.entered.filter(Boolean).length+1} / 3</div><h2>${esc(s.names[s.writer])}，請寫一個提示詞</h2><p class="muted">這是要猜的答案（不能直接寫答案）：</p><div class="center"><span class="word">${esc(t[0])}</span></div><div class="spaced"><label for="clue">我的提示詞</label><input id="clue" maxlength="15" autocomplete="off" placeholder="輸入 1 個提示詞"><p class="muted">請用自己的想法提示，盡量不要和其他人一樣。</p><p class="toast" id="error"></p>${btn('🔒 確認並遮住畫面','submitClue')}</div>`;
else if(s.stage==='review')body=`<div class="phase">老師檢查提示</div><h2>三位學生都寫完了！</h2><p>請先讓猜題者背對畫面，確認重複詞彙已遮蓋。</p><div class="grid">${other().map(i=>`<div class="hint ${duplicates().includes(i)?'cross':''}">${duplicates().includes(i)?'🚫 重複已遮蓋':esc(s.clues[i])}<div class="muted" style="font-size:16px;text-decoration:none">${esc(s.names[i])}</div></div>`).join('')}</div><p class="muted">重複判定：忽略空白、全形半形與英文字母大小寫；意思相近但文字不同不會自動遮蓋，老師可手動取消。</p><div class="spaced">${other().map(i=>`<label style="display:block;font-size:18px;margin:10px 0"><input type="checkbox" data-cancel="${i}" ${s.manualCanceled?.includes(i)?'checked':''}> 老師取消 ${esc(s.names[i])} 的提示（違規或不適合）</label>`).join('')}</div><div class="spaced">${btn('✅ 提示確認，請猜題者回來','showHints')}</div>`;
else if(s.stage==='guess'||s.stage==='choice'){
const filtered=other().filter(i=>!duplicates().includes(i)&&!(s.manualCanceled||[]).includes(i));
body=`<div class="phase">第 ${s.round+1} 回合｜${s.stage==='guess'?'自由猜詞':'選擇題'}</div><h2>${esc(s.names[s.guessIndex])}，請猜答案！</h2><p class="muted">有效提示：</p><div class="grid">${filtered.length?filtered.map(i=>`<div class="hint">${esc(s.clues[i])}</div>`).join(''):'<div class="hint">沒有可以顯示的提示</div>'}</div>`;
if(s.stage==='guess')body+=`<p class="spaced">先說出你想到的答案，再請老師按按鈕。</p><div class="row spaced">${btn('✅ 直接猜對（+2）','directCorrect','success')}${btn('改成選擇題','toChoice','secondary')}${btn('我猜不到，公布答案','reveal','warning')}</div>`;
else {const choices=s.mcOrder||[0,1,2,3];body+=`<p class="spaced"><b>只能選一次，按下去就不能修改！</b></p><div class="grid">${choices.map(k=>`<button class="answer-choice" data-choice="${k}" ${s.mcSelection!==null?'disabled':''}>${esc(t[k])}</button>`).join('')}</div><div class="spaced">${btn('我猜不到，公布答案','reveal','warning')}</div>`}
}
else if(s.stage==='result'){
let valid=other().filter(i=>!duplicates().includes(i)&&!(s.manualCanceled||[]).includes(i));let won=s.outcome==='direct'||s.outcome==='choice-correct';let gain=s.outcome==='direct'?2:s.outcome==='choice-correct'?1:0;
body=`<div class="phase">第 ${s.round+1} 回合結束</div><h1 class="center ${won?'result-good':'result-bad'}">${won?'🎉 猜對了！':'答案揭曉'}</h1><div class="center"><p>正確答案是</p><span class="word">${esc(t[0])}</span></div><div class="separator"></div><h2>本回合加分</h2><div class="grid">${s.names.map((name,i)=>{let p=i===s.guessIndex?gain:(won&&valid.includes(i)?1:0);return `<div class="hint" style="font-size:21px">${esc(name)}<br><b style="font-size:27px;color:${p?'#158463':'#66758e'}">+${p} 分</b></div>`}).join('')}</div><p class="muted">${s.outcome==='direct'?'直接猜對：猜題者 +2 分':s.outcome==='choice-correct'?'選擇題答對：猜題者 +1 分':s.outcome==='choice-wrong'?'選擇題第一次作答錯誤：不可重選':s.outcome==='violation'?'有人說出答案，本題違規作廢，全員不加分':'猜題者選擇公布答案'}。${won?'有效提示者各 +1 分。':'本回合不加提示分。'}</p><div class="row spaced">${btn(s.outcome==='violation'?'➡ 同一位學生猜下一題':'➡ 下一回合','nextRound','success')}${btn('查看記錄','records','secondary')}</div>`;
}
else if(s.stage==='records')body=`<h1>📋 歷次記分紀錄</h1><div class="rules">${s.logs.length?[...s.logs].reverse().map(log=>`<p>第 ${log.round} 回合：${esc(log.answer)}｜猜題者 ${esc(log.guesser)}｜${esc(log.method)}｜分數：${log.awards.map((p,i)=>`${esc(s.names[i])} +${p}`).join('、')}</p>`).join(''):'尚未完成回合'}</div><div class="row spaced">${btn('繼續遊戲','backFromRecords')}${btn('下載紀錄 CSV','exportCSV','secondary')}</div>`;
return `<div class="panel">${body}${!['setup','result','records'].includes(s.stage)?`<div class="separator"></div><div class="row between"><span class="muted" style="font-size:16px">老師專用：有人不小心說出答案？</span>${btn('⚠ 違規：本題作廢','violation','warning')}</div>`:''}</div><div class="footer">🔐 本遊戲在單一裝置離線運作。分數與進度存在目前瀏覽器，重新整理仍會保留；更換裝置不會自動同步。提醒學生勿查看他人輸入畫面。</div>`;
}
function render(){ $('scoreboard').innerHTML=scoreboard();$('screen').innerHTML=screen();save()}
function finish(type){if(s.stage==='result')return;let success=['direct','choice-correct'].includes(type),valid=other().filter(i=>!duplicates().includes(i)&&!(s.manualCanceled||[]).includes(i));let awards=[0,0,0,0];if(success){awards[s.guessIndex]=type==='direct'?2:1;valid.forEach(i=>awards[i]=1)}awards.forEach((p,i)=>s.points[i]+=p);s.outcome=type;s.logs.push({round:s.round+1,answer:target()[0],guesser:s.names[s.guessIndex],method:({direct:'直接答對','choice-correct':'選擇題答對','choice-wrong':'選擇題答錯','reveal':'公布答案','violation':'違規作廢'})[type],awards,clues:[...s.clues]});s.stage='result';render()}
function action(a){
switch(a){
case 'start':s.names=s.names.map((v,i)=>$('name'+i).value.trim()||'學生 '+(i+1));if(!s.order.length)setupOrder();s.guessIndex=s.round%4;s.stage='intro';break;
case 'beginWriting':s.coverTarget=nextWriter();s.stage='handoff';break;
case 'openWord':s.writer=s.coverTarget;s.stage='writing';break;
case 'submitClue':{let v=$('clue').value.trim();if(!v){$('error').textContent='請先輸入一個提示詞';return}if(clean(v)===clean(target()[0])){$('error').textContent='提示詞不能和正確答案完全相同';return}s.clues[s.writer]=v;s.entered[s.writer]=true;const next=nextWriter();if(next===undefined)s.stage='review';else{s.coverTarget=next;s.stage='handoff'}break}
case 'showHints':s.stage='guess';break;
case 'directCorrect':finish('direct');return;
case 'toChoice':s.mcOrder=shuffled(4);s.mcSelection=null;s.stage='choice';break;
case 'reveal':finish('reveal');return;
case 'violation':if(confirm('確定有人說出正確答案？這一題將作廢，所有人 +0 分，下一題維持同一位猜題者。'))finish('violation');return;
case 'nextRound':{const keepGuesser=s.outcome==='violation';s.round++;if(!keepGuesser)s.guessIndex=(s.guessIndex+1)%4;s.clues=['','','',''];s.entered=[false,false,false,false];s.manualCanceled=[];s.mcSelection=null;s.outcome=null;if(s.round>=s.order.length){s.order=shuffled(BANK.length+s.custom.length);s.round=0;}s.stage='intro';break;}
case 'records':s.prevStage=s.stage;s.stage='records';break;
case 'backFromRecords':s.stage=s.prevStage||'intro';break;
case 'addCustom':{let lines=($('customInput')?.value||'').trim().split(/\n/).filter(Boolean);let added=0;for(let line of lines){let a=line.split(/[,，、]/).map(x=>x.trim()).filter(Boolean);if(a.length===4&&new Set(a.map(clean)).size===4){s.custom.push(a);added++}}$('customCount').textContent=`已加入 ${added} 題。自訂題目共 ${s.custom.length} 題；下一次重新開始將加入題庫。`;s.order=[];save();return}
case 'exportCSV':{let lines=[['回合','答案','猜題者','方式',...s.names].join(',')];for(let l of s.logs)lines.push([l.round,l.answer,l.guesser,l.method,...l.awards].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(','));let b=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download='獨家暗語_課堂得分.csv';x.click();URL.revokeObjectURL(u);return}
}render()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(b){action(b.dataset.act);return}let ch=e.target.closest('[data-choice]');if(ch&&s.stage==='choice'&&s.mcSelection===null){s.mcSelection=Number(ch.dataset.choice);finish(s.mcSelection===0?'choice-correct':'choice-wrong')}});
document.addEventListener('change',e=>{if(e.target.matches('[data-cancel]')){let i=+e.target.dataset.cancel;s.manualCanceled=s.manualCanceled||[];if(e.target.checked&&!s.manualCanceled.includes(i))s.manualCanceled.push(i);else s.manualCanceled=s.manualCanceled.filter(v=>v!==i);save()}});
$('homeBtn').onclick=()=>{if(confirm('回到設定並清空所有分數、回合與紀錄嗎？（自訂詞彙會保留）')){let custom=s.custom;s=fresh();s.custom=custom;render()}};
render();
</script>
</body></html>
